# Miniforge / conda environment for Galileo
name: galileo-gfm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # numerics
  - numpy=1.26.4
  - pandas=1.5.3
  - scikit-learn=1.4.1.post1
  - h5py=3.10.0
  - matplotlib=3.8.3
  - einops=0.7.0
  - tqdm=4.66.2
  # geospatial (compiled libraries from conda-forge)
  - rasterio=1.3.10
  - fiona=1.9.6
  - geopandas=0.14.3
  - rioxarray=0.15.1
  - xarray=2024.3.0
  - affine<3
  - mapclassify<2.7 # newer versions need pandas>=2.1; the repo pins pandas 1.5.3
  # utilities
  - requests
  - python-dotenv
  - pip:
      # PyTorch: Windows and macOS get the CPU build; Linux gets the CUDA build.
      # For an NVIDIA GPU on Windows, or CPU-only on Linux, see the notes at the end.
      - torch==2.2.1
      - torchvision==0.17.1
      - earthengine-api==0.1.391
      - wandb==0.16.3
      - geobench==1.0.0
      - timm==1.0.22
      - satlaspretrain-models==0.3.1
      - breizhcrops==0.0.4.1
      - fast_pytorch_kmeans==0.2.2
      - types-requests
      - marimo # for the repo's notebooks (optional)


# NVIDIA GPU on Windows (optional; nano runs fine on CPU). After creating the env:
#   pip install torch==2.2.1 torchvision==0.17.1 --index-url https://download.pytorch.org/whl/cu121 --force-reinstall --no-deps
#
# CPU-only PyTorch on Linux (smaller download, no NVIDIA packages). After creating the env:
#   pip install torch==2.2.1 torchvision==0.17.1 --index-url https://download.pytorch.org/whl/cpu --force-reinstall --no-deps
